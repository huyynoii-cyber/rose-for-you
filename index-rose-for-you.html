<!doctype html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A Rose For You · 20/10</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,600&family=Be+Vietnam+Pro:wght@300;400&display=swap" rel="stylesheet">
<style>
:root{--pink:#d9587a;--ink:#6b2d44;--soft:#8a4c63;--g1:#fde6ec;--g2:#fff1e4;--g3:#e6cfee;--glow:rgba(255,255,255,.75);--btn:rgba(255,255,255,.55);--btnb:rgba(255,255,255,.85);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--pink:#ff9db8;--ink:#ffd9e4;--soft:#e9b3c6;--g1:#3a1f2d;--g2:#2a1a26;--g3:#2c2140;--glow:rgba(255,160,195,.16);--btn:rgba(255,255,255,.1);--btnb:rgba(255,255,255,.25)}}
:root[data-theme=dark]{--pink:#ff9db8;--ink:#ffd9e4;--soft:#e9b3c6;--g1:#3a1f2d;--g2:#2a1a26;--g3:#2c2140;--glow:rgba(255,160,195,.16);--btn:rgba(255,255,255,.1);--btnb:rgba(255,255,255,.25)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;overflow:hidden;font-family:'Be Vietnam Pro',system-ui,sans-serif;background:var(--g2)}
body{background:radial-gradient(ellipse 60% 45% at 50% 38%,var(--glow),transparent 70%),linear-gradient(165deg,var(--g1),var(--g2) 50%,var(--g3))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--g1)}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#bk i{position:fixed;border-radius:50%;filter:blur(7px);pointer-events:none;background:radial-gradient(circle,rgba(255,255,255,.75),rgba(255,190,215,0) 70%)}
#veil{position:fixed;inset:0;background:#1a0f16;pointer-events:none;z-index:5}
#ui{position:fixed;left:0;right:0;bottom:0;z-index:6;padding:0 20px calc(16px + env(safe-area-inset-bottom,0px));text-align:center;color:var(--ink);pointer-events:none}
h1{font:italic 600 clamp(1.9rem,7vw,3.3rem)/1.1 'Cormorant Garamond',Georgia,serif;margin:0 0 .35em}
p{margin:0 auto;max-width:26ch;font:400 clamp(1.05rem,4.4vw,1.5rem)/1.5 'Be Vietnam Pro',system-ui,sans-serif;letter-spacing:.01em;color:var(--pink)}
.t{opacity:0}
.row{display:flex;gap:10px;justify-content:center;margin-top:16px;opacity:0;pointer-events:auto}
button{font:400 .9rem 'Be Vietnam Pro',system-ui,sans-serif;color:var(--ink);background:var(--btn);border:1px solid var(--btnb);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);padding:.6em 1.2em;border-radius:99px;cursor:pointer;min-height:44px}
button:disabled{opacity:.5;cursor:default}
button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.sp{position:fixed;left:0;top:0;width:9px;height:9px;margin:-4px 0 0 -4px;border-radius:50%;pointer-events:none;z-index:4;background:radial-gradient(circle,#fff 0,#ffc46b 40%,rgba(255,157,184,0) 72%)}
</style></head>
<body>
<div id="bk"></div>
<div id="veil"></div>
<div id="ui">
<h1 class="t">Happy Women's Day 20/10</h1>
<p class="t">Chúc mừng ngày Phụ nữ Việt Nam 20-10</p>
<div class="row"><button id="again" disabled>Nở lại 🌸</button><button id="spin" aria-pressed="true">Xoay ⟳</button><button id="mus" aria-pressed="false">Bật nhạc ♪</button></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
const T=THREE,$=s=>document.querySelector(s),C=h=>new T.Color(h),lp=(a,b,x)=>a+(b-a)*x,cl=(x,a,b)=>Math.min(b,Math.max(a,x));
const R=new T.WebGLRenderer({antialias:true,alpha:true});
R.setPixelRatio(Math.min(devicePixelRatio,2));R.toneMapping=T.ACESFilmicToneMapping;R.toneMappingExposure=1.2;
document.body.prepend(R.domElement);
const sc=new T.Scene(),cam=new T.PerspectiveCamera(30,1,.1,80),S={lit:0,t:0,zoom:0,pulse:0},V={yaw:0,pitch:.08,ty:0,tp:.08};
let D=9,tgY=1.2;

/* ---- environment: soft boxes for glass reflections ---- */
(()=>{const e=new T.Scene();
e.add(new T.Mesh(new T.SphereGeometry(40,16,12),new T.MeshBasicMaterial({color:0xffe3ea,side:T.BackSide})));
const P=(w,h,x,y,z,c,k)=>{const m=new T.Mesh(new T.PlaneGeometry(w,h),new T.MeshBasicMaterial({color:C(c).multiplyScalar(k),side:T.DoubleSide}));m.position.set(x,y,z);m.lookAt(0,2,0);e.add(m)};
P(3,14,-9,5,2,0xfff1dd,7);P(3,14,9,5,2,0xffd0df,5);P(10,3,0,14,0,0xffffff,5);P(12,6,0,5,-12,0xffc9d8,3);
sc.environment=new T.PMREMGenerator(R).fromScene(e,.02).texture})();

/* ---- lights: key (warm, top-left), fill (pink), rim, ambient ---- */
const key=new T.DirectionalLight(0xffd9b0,0),fill=new T.DirectionalLight(0xffa8c0,0),rim=new T.DirectionalLight(0xffffff,0),amb=new T.AmbientLight(0xffe9ee,0);
key.position.set(-4,6,5);fill.position.set(5,2,4);rim.position.set(0,4,-6);const glint=new T.PointLight(0xfff0d8,0,12,1.5);sc.add(key,fill,rim,amb,glint);

/* ---- generic grid surface ---- */
function surf(nu,nv){const g=new T.BufferGeometry(),ix=[],n=(nu+1)*(nv+1);
for(let i=0;i<nu;i++)for(let j=0;j<nv;j++){const a=i*(nv+1)+j,b=a+nv+1;ix.push(a,b,a+1,b,b+1,a+1)}
g.setIndex(ix);g.setAttribute('position',new T.BufferAttribute(new Float32Array(n*3),3));g.setAttribute('color',new T.BufferAttribute(new Float32Array(n*3),3));return g}

/* ---- rose petals: curved, tapered, rippled, per-frame bend ---- */
const NU=12,NV=10,cA=C('#E996AB'),cB=C('#F4B6C2'),cC=C('#FFE4E9'),tmp=new T.Color();
function paint(g,s){const a=g.attributes.color;let k=0;
for(let i=0;i<=NU;i++){const u=i/NU;for(let j=0;j<=NV;j++){const v=j/NV*2-1;
tmp.copy(cA).lerp(cB,Math.min(1,u*1.6)).lerp(cC,Math.pow(Math.abs(v),3)*.45*u+u*u*u*.18).multiplyScalar(.9+.1*s);a.setXYZ(k++,tmp.r,tmp.g,tmp.b)}}a.needsUpdate=true}
function fillPetal(g,p,phi,bend,cup,fl,r){const pos=g.attributes.position,ds=p.L/NU;let k=0,y=0,z=r;
for(let i=0;i<=NU;i++){const u=i/NU,a=phi+bend*u,ca=Math.cos(a),sa=Math.sin(a);
if(i){y+=ca*ds;z+=sa*ds}
const w=(.16+.84*Math.pow(Math.sin(Math.min(1,u*1.18)*Math.PI/2),.9))*p.W/2;
for(let j=0;j<=NV;j++){const v=j/NV*2-1,lo=.16*p.L*v*v*u*u*u,
off=cup*v*v*p.W*.5*(.25+u)+(.02+.03*p.s)*Math.sin(v*4+u*6+p.sd)*u*u*p.L+fl*u*u;
pos.setXYZ(k++,v*w,y-ca*lo+sa*off,z-sa*lo-ca*off)}}
pos.needsUpdate=true;g.computeVertexNormals()}

const flower=new T.Group(),rose=new T.Group();rose.position.y=1.43;flower.add(rose);sc.add(flower);
const pm=new T.MeshPhysicalMaterial({vertexColors:true,side:T.DoubleSide,roughness:.55,sheen:1,sheenRoughness:.5,sheenColor:C('#ffe4e9'),envMapIntensity:.8});
const N=32,pet=[];let sd=7;const rnd=()=>(sd=sd*16807%2147483647)/2147483647;
for(let i=0;i<N;i++){const s=i/(N-1),g=surf(NU,NV);paint(g,s);
const m=new T.Mesh(g,pm);m.frustumCulled=false;m.rotation.y=i*2.39996+(rnd()-.5)*.25;rose.add(m);
pet.push({g,s,r:.015+.12*s+rnd()*.015,L:(.3+.42*s)*(.94+rnd()*.12),W:(.34+.5*s)*(.92+rnd()*.16),sd:rnd()*6,dl:(1-s)*2.7+rnd()*.25})}
const E=x=>x*x*x*(x*(x*6-15)+10);
function updRose(t,tm){for(const p of pet){const u=cl((t-p.dl)/4.2,0,1),x=E(u),y=E(cl((t-p.dl-.35)/4.2,0,1)),s=p.s,o=Math.sin(Math.PI*u);
fillPetal(p.g,p,lp(.06*s,.08+.95*s*s+.05*s,x),lp(-.7+.2*s,-.45*(1-s)+.35*s,y)+.1*o*s+Math.sin(tm*.9+p.sd)*.018*x,lp(.55,.38,y),Math.sin(tm*1.2+p.sd*2)*(.01+.03*M.h)*x*s,p.r+x*.07*s)}}

/* ---- leaves (serrated, veined) ---- */
const lA=C('#244f31'),lB=C('#4f8a55');
function leaf(){const nu=12,nv=6,g=surf(nu,nv),P=g.attributes.position,Co=g.attributes.color;let k=0;
for(let i=0;i<=nu;i++){const u=i/nu,y=u*(1-.25*u),z=.2*u*u,w=Math.sin(Math.PI*Math.pow(u,.75))*.23*(1+.14*(Math.abs((u*9)%1-.5)*2-.5));
for(let j=0;j<=nv;j++){const v=j/nv*2-1;P.setXYZ(k,v*w,y,z+.3*Math.abs(v)*w);
tmp.copy(lA).lerp(lB,.35+.45*Math.abs(v)).multiplyScalar((1-.4*Math.exp(-v*v*40))*(1-.12*Math.pow(Math.max(0,Math.sin(u*38-Math.abs(v)*9)),6)));Co.setXYZ(k++,tmp.r,tmp.g,tmp.b)}}
g.computeVertexNormals();return g}
const lg=leaf(),lm=new T.MeshStandardMaterial({vertexColors:true,side:T.DoubleSide,roughness:.7}),
curve=new T.CatmullRomCurve3([new T.Vector3(0,.02,0),new T.Vector3(.05,.5,.04),new T.Vector3(-.03,1,-.03),new T.Vector3(0,1.43,0)]);
flower.add(new T.Mesh(new T.TubeGeometry(curve,32,.026,8),new T.MeshStandardMaterial({color:0x2d5a3a,roughness:.75})));
[[.12,.4,1,.55],[.38,2.7,1.05,.5],[.62,4.6,.95,.44],[.28,5.6,1.1,.4]].forEach(([f,a,tl,sz])=>{
const g=new T.Group(),m=new T.Mesh(lg,lm);g.position.copy(curve.getPoint(f+.1));g.rotation.y=a;m.rotation.x=tl;m.scale.setScalar(sz*1.1);g.add(m);flower.add(g)});
for(let i=0;i<5;i++){const g=new T.Group(),m=new T.Mesh(lg,lm);g.position.y=1.42;g.rotation.y=i*1.2566;m.rotation.x=1.25;m.scale.set(.5,.26,.5);g.add(m);flower.add(g)}

/* ---- glass dome (thick lathe shell, physical transmission) ---- */
const pr=[];for(let k=0;k<=18;k++){const a=k/18*Math.PI/2;pr.push(new T.Vector2(1.16*Math.sin(a),1.9+1.16*Math.cos(a)))}
pr.push(new T.Vector2(1.16,.02),new T.Vector2(1.2,.02));
for(let k=18;k>=0;k--){const a=k/18*Math.PI/2;pr.push(new T.Vector2(1.2*Math.sin(a),1.9+1.2*Math.cos(a)))}
const dome=new T.Mesh(new T.LatheGeometry(pr,72),new T.MeshPhysicalMaterial({transmission:1,roughness:0,metalness:0,ior:1.12,thickness:.02,envMapIntensity:0,side:T.DoubleSide,specularIntensity:.5}));
sc.add(dome);
const ring=new T.Mesh(new T.TorusGeometry(1.18,.014,8,96),new T.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:.55}));ring.rotation.x=Math.PI/2;ring.position.y=.03;sc.add(ring);

/* ---- walnut base ---- */
function wood(){const c=document.createElement('canvas');c.width=c.height=512;const x=c.getContext('2d');x.fillStyle='#3b2217';x.fillRect(0,0,512,512);
for(let i=0;i<150;i++){x.strokeStyle=`rgba(${20+Math.random()*40|0},${8+Math.random()*20|0},4,${.15+Math.random()*.3})`;x.lineWidth=.6+Math.random()*2.5;x.beginPath();const y=Math.random()*512,ph=Math.random()*6;x.moveTo(0,y);for(let X=0;X<=512;X+=32)x.lineTo(X,y+Math.sin(X*.015+ph)*5);x.stroke()}
const t=new T.CanvasTexture(c);t.wrapS=t.wrapT=T.RepeatWrapping;t.colorSpace=T.SRGBColorSpace;return t}
const bp=[[0,-.3],[1.48,-.3],[1.52,-.26],[1.52,-.19],[1.45,-.16],[1.45,-.09],[1.34,-.07],[1.32,-.02],[1.27,0],[1.25,.02],[1.22,.02],[0,.02]].map(a=>new T.Vector2(...a));
const base=new T.Mesh(new T.LatheGeometry(bp,72),new T.MeshPhysicalMaterial({map:wood(),roughness:.38,clearcoat:.5,clearcoatRoughness:.3,side:T.DoubleSide}));sc.add(base);
(()=>{const c=document.createElement('canvas');c.width=c.height=128;const x=c.getContext('2d'),g=x.createRadialGradient(64,64,0,64,64,64);g.addColorStop(0,'rgba(70,25,40,.45)');g.addColorStop(1,'rgba(70,25,40,0)');x.fillStyle=g;x.fillRect(0,0,128,128);
const m=new T.Mesh(new T.PlaneGeometry(5.2,5.2),new T.MeshBasicMaterial({map:new T.CanvasTexture(c),transparent:true,depthWrite:false}));m.rotation.x=-Math.PI/2;m.position.y=-.295;sc.add(m)})();

/* ---- floating light motes + tap sparkles ---- */
const gt=(()=>{const c=document.createElement('canvas');c.width=c.height=64;const x=c.getContext('2d'),g=x.createRadialGradient(32,32,0,32,32,32);g.addColorStop(0,'rgba(255,255,255,1)');g.addColorStop(.3,'rgba(255,255,255,.6)');g.addColorStop(1,'rgba(255,255,255,0)');x.fillStyle=g;x.fillRect(0,0,64,64);return new T.CanvasTexture(c)})();
const NP=110,pp=new Float32Array(NP*3),pc=new Float32Array(NP*3),ph=[];
for(let i=0;i<NP;i++){pp.set([(Math.random()-.5)*5.4,Math.random()*3.6,(Math.random()-.5)*3.6],i*3);ph.push(Math.random()*6);C(i%3?0xffc46b:0xff9db8).toArray(pc,i*3)}
const pg=new T.BufferGeometry();pg.setAttribute('position',new T.BufferAttribute(pp,3));pg.setAttribute('color',new T.BufferAttribute(pc,3));
const pmat=new T.PointsMaterial({map:gt,size:.1,vertexColors:true,transparent:true,opacity:0,depthWrite:false}),pts=new T.Points(pg,pmat);pts.frustumCulled=false;sc.add(pts);
const NB=50,bq=new Float32Array(NB*3),bv=Array.from({length:NB},()=>[0,0,0]),bg=new T.BufferGeometry();bg.setAttribute('position',new T.BufferAttribute(bq,3));
const bmat=new T.PointsMaterial({map:gt,size:.13,color:0xffc46b,transparent:true,opacity:0,depthWrite:false}),bpts=new T.Points(bg,bmat);bpts.frustumCulled=false;sc.add(bpts);let bt=9;
function burst(p){for(let i=0;i<NB;i++){bq.set([p.x,p.y,p.z],i*3);const a=Math.random()*6.28,b=Math.random()*3.14-1.57,sp=.5+Math.random()*1.1;bv[i]=[Math.cos(a)*Math.cos(b)*sp,Math.sin(b)*sp+.3,Math.sin(a)*Math.cos(b)*sp]}bt=0;bg.attributes.position.needsUpdate=true}

/* ---- camera, drag orbit, tap ---- */
function fit(){const w=innerWidth,h=innerHeight,a=w/h,th=Math.tan(cam.fov*Math.PI/360);R.setSize(w,h);cam.aspect=a;cam.updateProjectionMatrix();D=Math.max(2.6/th,1.75/(th*a));tgY=1.5-th*D*.2}
addEventListener('resize',fit);fit();
const cv=R.domElement,rc=new T.Raycaster(),mv=new T.Vector2();let pd=null;
cv.addEventListener('pointerdown',e=>{pd={x:e.clientX,y:e.clientY,m:0,yw:V.ty,pt:V.tp,lx:e.clientX,v:0};cv.setPointerCapture(e.pointerId)});
cv.addEventListener('pointermove',e=>{if(!pd)return;const dx=e.clientX-pd.x,dy=e.clientY-pd.y;pd.m=Math.max(pd.m,Math.hypot(dx,dy));pd.v=(pd.lx-e.clientX)*.008;pd.lx=e.clientX;V.ty=pd.yw-dx*.008;V.tp=cl(pd.pt+dy*.004,-.05,.3)});
const M={x:0,y:0,h:0,hh:0};let hitT=0,spT=0,spin=true;
addEventListener('pointermove',e=>{M.x=e.clientX/innerWidth*2-1;M.y=-(e.clientY/innerHeight)*2+1;if(e.pointerType!=='mouse')return;const n=performance.now();
if(n-spT>35){spT=n;const s=document.createElement('i');s.className='sp';s.style.left=e.clientX+'px';s.style.top=e.clientY+'px';document.body.append(s);gsap.to(s,{y:-18-Math.random()*22,x:(Math.random()-.5)*26,opacity:0,scale:.2,duration:.9,ease:'power1.out',onComplete:()=>s.remove()})}
if(n-hitT>80&&!pd){hitT=n;mv.set(M.x,M.y);rc.setFromCamera(mv,cam);const h=rc.intersectObject(flower,true).length>0;cv.style.cursor=h?'pointer':'';M.hh=h?1:0}});
const up=e=>{if(pd&&pd.m<8&&e.type==='pointerup'){mv.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1);rc.setFromCamera(mv,cam);const h=rc.intersectObject(flower,true)[0];
if(h){burst(h.point);gsap.fromTo(S,{pulse:0},{pulse:.05,duration:.35,yoyo:true,repeat:1,ease:'sine.inOut'})}}if(pd&&pd.m>=8)V.ty+=cl(pd.v*10,-1.5,1.5);pd=null;V.tp=.08};
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);

/* ---- main loop ---- */
const clk=new T.Clock();
(function loop(){requestAnimationFrame(loop);const dt=Math.min(clk.getDelta(),.05),tm=clk.elapsedTime;
if(!pd&&spin&&S.t>=7.6)V.ty+=dt*.22;V.yaw+=(V.ty-V.yaw)*.07;V.pitch+=(V.tp-V.pitch)*.06;
const d=D*(1.08-.1*S.zoom),cp=Math.cos(V.pitch);cam.position.set(d*Math.sin(V.yaw)*cp,tgY+d*Math.sin(V.pitch),d*Math.cos(V.yaw)*cp);cam.lookAt(0,tgY,0);
const L=S.lit,pr=S.t/7.6;key.intensity=L*(1.1+.9*pr);fill.intensity=L*.7;rim.intensity=L*1.5;amb.intensity=L*.35;
dome.material.envMapIntensity=.8*L;ring.material.opacity=.3*L;base.material.color.setScalar(L);base.material.envMapIntensity=.9*L;
updRose(S.t,tm);rose.scale.setScalar(1+S.pulse+.01*Math.sin(tm*1.1));flower.rotation.y=Math.sin(tm*.3)*.1;M.h+=(M.hh-M.h)*.08;rose.rotation.x+=(-M.y*.18-rose.rotation.x)*.05;rose.rotation.z+=(-M.x*.18-rose.rotation.z)*.05;glint.position.set(M.x*3.2,1.6+M.y*2,3.6);glint.intensity=L*(.6+.6*M.h);
pmat.opacity=.85*L*cl((S.t-1.5)/3,0,1);const a=pg.attributes.position.array;
for(let i=0;i<NP;i++){a[i*3+1]+=dt*(.07+.05*Math.sin(ph[i]));a[i*3]+=Math.sin(tm*.4+ph[i])*.0015;if(a[i*3+1]>3.8)a[i*3+1]=0}pg.attributes.position.needsUpdate=true;
if(bt<1.5){bt+=dt;for(let i=0;i<NB;i++){bv[i][1]-=.5*dt;for(let k=0;k<3;k++)bq[i*3+k]+=bv[i][k]*dt}bg.attributes.position.needsUpdate=true;bmat.opacity=Math.max(0,1-bt/1.4)}
R.render(sc,cam)})();

/* ---- sequence ---- */
function reveal(){gsap.to('.t',{opacity:1,y:0,duration:1.6,stagger:.9,ease:'power2.out'});$('#again').disabled=false}
function play(first){gsap.killTweensOf(S);S.t=0;S.zoom=0;$('#again').disabled=true;gsap.set('.t',{opacity:0,y:18});
const dl=first?2:.5;gsap.to(S,{t:7.6,duration:7.6,ease:'none',delay:dl,onComplete:reveal});gsap.to(S,{zoom:1,duration:9,ease:'sine.inOut',delay:dl})}
play(true);gsap.to(S,{lit:1,duration:2.4,delay:.2,ease:'power1.out'});gsap.to('#veil',{opacity:0,duration:2.2,ease:'power1.inOut'});gsap.to('.row',{opacity:1,duration:1,delay:2.6});
$('#again').onclick=()=>play(false);
$('#spin').onclick=e=>{spin=!spin;e.target.setAttribute('aria-pressed',spin);e.target.style.opacity=spin?1:.6};
for(let i=0;i<9;i++){const b=document.createElement('i'),s=30+Math.random()*90;Object.assign(b.style,{width:s+'px',height:s+'px',left:Math.random()*100+'%',top:Math.random()*100+'%',opacity:.15+Math.random()*.3});$('#bk').append(b);gsap.to(b,{y:(Math.random()-.5)*50,x:(Math.random()-.5)*40,duration:6+Math.random()*6,repeat:-1,yoyo:true,ease:'sine.inOut'})}

/* ---- soft synth piano (starts only after a tap) ---- */
let ac,on=false,mt;
function note(f){const t=ac.currentTime;[[1,.5,'sine'],[2,.12,'triangle']].forEach(([m,v,ty])=>{const o=ac.createOscillator(),g=ac.createGain();o.type=ty;o.frequency.value=f*m;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.012);g.gain.exponentialRampToValueAtTime(.001,t+2.4);o.connect(g);g.connect(mt);o.start(t);o.stop(t+2.5)})}
const song=new Audio('perfect.mp3'),SS=140,SE=180;let songOK=false;song.preload='auto';song.addEventListener('canplay',()=>{songOK=true},{once:true});song.addEventListener('timeupdate',()=>{if(song.currentTime>=SE)song.currentTime=SS});
$('#mus').onclick=e=>{if(songOK){on=!on;if(on){song.currentTime=SS;song.play()}else song.pause();e.target.textContent=on?'Tắt nhạc ♪':'Bật nhạc ♪';e.target.setAttribute('aria-pressed',on);return}if(!ac){ac=new(window.AudioContext||window.webkitAudioContext)();mt=ac.createGain();mt.gain.value=.16;const d=ac.createDelay(),f=ac.createGain();d.delayTime.value=.42;f.gain.value=.38;d.connect(f);f.connect(d);mt.connect(d);d.connect(ac.destination);mt.connect(ac.destination);
const ch=[[261.6,329.6,392,493.9],[220,261.6,329.6,392],[174.6,220,261.6,329.6],[196,246.9,293.7,392]],ar=[0,1,2,3,2,1,3,2];let n=0;
setInterval(()=>{if(!on)return;const c=ch[(n>>3)%4];note(c[ar[n%8]]*(n%8?1:.5));n++},520)}
on=!on;if(ac.state==='suspended')ac.resume();e.target.textContent=on?'Tắt nhạc ♪':'Bật nhạc ♪';e.target.setAttribute('aria-pressed',on)};
/* ---- comet flock every 6s ---- */
const cc=document.createElement('canvas'),cx=cc.getContext('2d');cc.style.cssText='position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:3';document.body.append(cc);
let comets=[],cd=1;function crs(){cd=Math.min(devicePixelRatio||1,2);cc.width=innerWidth*cd;cc.height=innerHeight*cd}crs();addEventListener('resize',crs);
function flock(){const W=innerWidth,H=innerHeight,n=3+(Math.random()*3|0),ang=.22+Math.random()*.18,dir=Math.random()<.5?1:-1;
for(let i=0;i<n;i++){const vx=dir*(W*.55+Math.random()*W*.2);comets.push({x:dir>0?-80-i*70:W+80+i*70,y:H*(.05+Math.random()*.4)-i*30,vx,vy:Math.abs(vx)*ang,len:140+Math.random()*120,r:2+Math.random()*1.6,c:i%2?'255,196,107':'255,157,184'})}}
setInterval(()=>{if(!document.hidden)flock()},6000);
let c0=performance.now();
(function ct(n){requestAnimationFrame(ct);const dt=Math.min((n-c0)/1000,.05);c0=n;cx.setTransform(cd,0,0,cd,0,0);cx.clearRect(0,0,innerWidth,innerHeight);
comets=comets.filter(c=>c.x>-420&&c.x<innerWidth+420&&c.y<innerHeight+200);
for(const c of comets){c.x+=c.vx*dt;c.y+=c.vy*dt;const m=Math.hypot(c.vx,c.vy),tx=c.x-c.vx/m*c.len,ty=c.y-c.vy/m*c.len,g=cx.createLinearGradient(c.x,c.y,tx,ty);
g.addColorStop(0,`rgba(${c.c},.95)`);g.addColorStop(1,`rgba(${c.c},0)`);cx.strokeStyle=g;cx.lineWidth=c.r*1.4;cx.lineCap='round';cx.beginPath();cx.moveTo(c.x,c.y);cx.lineTo(tx,ty);cx.stroke();
const h=cx.createRadialGradient(c.x,c.y,0,c.x,c.y,c.r*5);h.addColorStop(0,'rgba(255,255,255,1)');h.addColorStop(.4,`rgba(${c.c},.6)`);h.addColorStop(1,`rgba(${c.c},0)`);cx.fillStyle=h;cx.beginPath();cx.arc(c.x,c.y,c.r*5,0,6.283);cx.fill()}})(c0);
</script>
